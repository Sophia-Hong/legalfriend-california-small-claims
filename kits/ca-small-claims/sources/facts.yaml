# Facts sheet — the ONLY substantive legal statements the kit may make.
#
# Every ebook chapter, practice note, and prompt cites facts by id (e.g. [F:limit-natural]).
# Anything not listed here must not be stated as fact; tell the reader to check the
# official source instead.
#
# confidence:
#   high   — well-established rule, cited to statute; still verify wording before release
#   medium — believed correct; subsection, number, or detail must be confirmed
# verified: false until an attorney confirms against the fetched official source
#           (sources/manifest.yaml). Release gate: every fact used in the kit is verified.
#
# Drafted 2026-09-29 from general knowledge, without network access to court sites.

schema_version: 1
as_of: 2026-09-29
facts:

  # ---------- Scope and limits ----------
  - id: limit-natural
    statement: A natural person (an individual) may generally sue for up to $12,500 in small claims court.
    cite: Cal. Code Civ. Proc. § 116.221
    sources: [ccp-116-221, cc-selfhelp-small-claims]
    confidence: high
    verified: false
  - id: limit-entity
    statement: The general limit for plaintiffs that are not natural persons (for example corporations, LLCs, partnerships) is $6,250.
    cite: Cal. Code Civ. Proc. § 116.220(a)(1)
    sources: [ccp-116-220]
    confidence: high
    verified: false
  - id: two-claims-rule
    statement: A person may not file more than two small claims cases demanding more than $2,500 anywhere in California in the same calendar year.
    cite: Cal. Code Civ. Proc. § 116.231
    sources: [ccp-116-231]
    confidence: high
    verified: false
  - id: waive-excess
    statement: A claim may not be split into several cases to fit under the limit; a plaintiff who sues in small claims for less than the full amount generally gives up the rest.
    cite: Cal. Code Civ. Proc. § 116.220 (subsection to confirm)
    sources: [ccp-116-220, cc-selfhelp-small-claims]
    confidence: medium
    verified: false
    source_check: >-
      2026-10-14 (Shirl): official self-help pages read on this date do not state this rule. The before-you-start page's loan example says a person may sue for missed installments and "sue them again if they miss more payments" — the attorney should check how that fits this statement. Statement unchanged pending statute check.

  # ---------- Who appears ----------
  - id: no-attorneys
    statement: Parties generally may not be represented by an attorney at the small claims hearing, though they may consult one before or after.
    cite: Cal. Code Civ. Proc. § 116.530
    sources: [ccp-116-530]
    confidence: high
    verified: false
  - id: entity-appearance
    statement: A corporation or other business entity appears through a regular employee, officer, or director who was not hired just to appear in small claims court (a partnership may also appear through a partner); the representative must file a declaration of authority (SC-109).
    cite: Cal. Code Civ. Proc. § 116.540(b), (c), (j)
    sources: [ccp-116-540]
    confidence: medium
    verified: false
    source_check: >-
      2026-10-14 (Shirl): official self-help pages read on this date do not state who appears for an entity; the forms page lists SC-109 (Authorization to Appear on Behalf of Party). Statement unchanged pending statute check.
      2026-10-16 (Yul, statute check 2A — theo-workspace reports/legalfriend/2026-10-16-ca-statute-check-2A.md fab3e7d46; official text from the Legislature's bulk data pubinfo_2025, records updated 2026-09-26): § 116.540(b) reads "only through a regular employee, or a duly appointed or elected
      officer or director, who is employed, appointed, or elected for purposes other than solely
      representing the corporation in small claims court"; (c) applies the same rule to other
      entities and lets a partnership appear through a partner; (j) requires a declaration of
      authority. "Authorized employee" replaced. The no-attorney rule is the separate fact
      no-attorneys (§ 116.530).
  - id: advisors
    statement: Most counties are required to have a small claims advisor who gives free legal information in small claims cases; the services offered vary from county to county.
    cite: Cal. Code Civ. Proc. § 116.260; California Courts, Find your Small Claims Advisor
    sources: [ccp-116-260, cc-selfhelp-small-claims-advisor, cc-selfhelp-small-claims]
    confidence: high
    verified: false
    source_check: >-
      2026-10-14 (Shirl): official page reads "Most counties are required to have a small
      claims advisor to give free legal information in small claims cases. The kinds of
      services offered vary from county to county." Earlier wording "Each county provides"
      overstated it. Statute text not read (leginfo blocked).

  # ---------- Before filing ----------
  - id: demand-first
    statement: Where possible, ask the defendant to pay (or, if the claim is for possession of property, to return the property) before you file. SC-100 item 4 says the request can be made in person, in writing, or by phone, and asks whether you did and, if not, why not.
    cite: Cal. Code Civ. Proc. § 116.320(b)(3); SC-100 item 4 (Rev. Jan. 1, 2026)
    sources: [ccp-116-320, jcc-form-sc-100]
    confidence: medium
    verified: false
    source_check: >-
      2026-10-16 (Yul, statute check 2A — theo-workspace reports/legalfriend/2026-10-16-ca-statute-check-2A.md fab3e7d46; official text from the Legislature's bulk data pubinfo_2025, records updated 2026-09-26): § 116.320(b)(3) — the claim form has a place to state "that the plaintiff, where
      possible, has demanded payment and, in applicable cases, possession of the property."
      SC-100 item 4 (Rev. Jan. 1, 2026): "You must ask the defendant (in person, in writing, or
      by phone) to pay you before you sue. If your claim is for possession of property, you must
      ask the defendant to give you the property. Have you done this? Yes / No If no, explain why
      not." First sentence is Yul's proposed wording; the "in person, in writing, or by phone"
      clause is from the form (Shirl 2026-10-16, theo-workspace
      reports/legalfriend/2026-10-16-sc100-demand-first-check.md cb70f3870).
  - id: sol-written-contract
    statement: The general limitations period for breach of a written contract is four years.
    cite: Cal. Code Civ. Proc. § 337
    sources: [ccp-337]
    confidence: high
    verified: false
  - id: sol-oral-contract
    statement: The general limitations period for breach of an oral contract is two years.
    cite: Cal. Code Civ. Proc. § 339
    sources: [ccp-339]
    confidence: high
    verified: false
  - id: sol-property-damage
    statement: The general limitations period for damage to property is three years.
    cite: Cal. Code Civ. Proc. § 338
    sources: [ccp-338]
    confidence: high
    verified: false
  - id: sol-personal-injury
    statement: The general limitations period for personal injury is two years.
    cite: Cal. Code Civ. Proc. § 335.1
    sources: [ccp-335-1]
    confidence: high
    verified: false
  - id: government-claim
    statement: Before suing a public entity (a city, county, state agency, school district, etc.), a claimant usually must first present a government claim — California Courts lists the deadlines as generally 6 months from the injury for an injury to you or damage to something you own, and 1 year for a broken contract or damage to your real estate, with exceptions — and may sue only after it is denied or deemed denied.
    cite: Cal. Gov. Code §§ 911.2, 945.4; California Courts, Ask a government agency to pay you
    sources: [cc-selfhelp-government-claim, gov-911-2, gov-945-4]
    confidence: high
    verified: false
    source_check: >-
      2026-10-14 (Shirl): official page lists "6 months from the injury if you are suing about
      an injury to you or damage to something you own" and "1 year from the date a contract
      was broken or your real estate was damaged", and says "There are exceptions." Earlier
      wording put all property damage at six months. Statute text not read (leginfo blocked).
      2026-10-16 (Yul, statute check 2A — theo-workspace reports/legalfriend/2026-10-16-ca-statute-check-2A.md fab3e7d46; official text from the Legislature's bulk data pubinfo_2025, records updated 2026-09-26): matches § 911.2(a) and § 945.4; § 912.4(a), (c) — no action within 45 days means the
      claim is deemed rejected.
  - id: government-suit-deadline
    statement: If the agency mails or hands you a written rejection, you must file your lawsuit within 6 months of that date. If the agency does not act within 45 days (unless you and the agency agree in writing to extend it), the claim is treated as rejected; if you never got a written rejection notice, you generally have 2 years from when the claim arose to sue.
    cite: Cal. Gov. Code §§ 912.4, 945.6(a)
    sources: [gov-912-4, gov-945-6]
    confidence: high
    verified: false
    source_check: >-
      2026-10-16 (Yul, statute check 2A — theo-workspace reports/legalfriend/2026-10-16-ca-statute-check-2A.md fab3e7d46; official text from the Legislature's bulk data pubinfo_2025, records updated 2026-09-26): § 945.6(a)(1) "not later than six months after the date such notice is personally
      delivered or deposited in the mail"; (a)(2) "within two years from the accrual of the cause
      of action" if written notice is not given under § 913; § 912.4(a), (c) 45 days, then deemed
      rejected (extendable by agreement). Statement is Yul's proposed wording.
      2026-10-16 (Yul recheck, Theo 1792109841): added the written-extension clause per
      § 912.4(b).

  # ---------- Defendant name ----------
  - id: defendant-name-collection
    statement: California Courts warns that naming the defendant incorrectly can prevent the plaintiff from collecting after winning.
    cite: California Courts, small claims forms guidance
    sources: [cc-selfhelp-fill-out-forms]
    confidence: high
    verified: false
  - id: fbn-declaration
    statement: A plaintiff doing business under a fictitious business name must file a declaration (form SC-103) showing compliance with the fictitious business name laws.
    cite: Cal. Code Civ. Proc. § 116.430; SC-103
    sources: [ccp-116-430, jcc-form-sc-103]
    confidence: high
    verified: false

  # ---------- Venue ----------
  - id: venue-basics
    statement: Small claims venue follows specific rules — commonly where a defendant lives or does business, where a contract was made or was to be performed, or where the injury or property damage happened — with special rules for certain consumer contracts.
    cite: Cal. Code Civ. Proc. § 116.370 (and the venue statutes it references)
    sources: [ccp-116-370]
    confidence: medium
    verified: false

  # ---------- Forms ----------
  - id: sc100-starts-case
    statement: A small claims case starts with form SC-100, Plaintiff's Claim and ORDER to Go to Small Claims Court.
    cite: Judicial Council form SC-100
    sources: [jcc-form-sc-100, cc-selfhelp-fill-out-forms]
    confidence: high
    verified: false
  - id: sc100-effective
    statement: As observed on 2026-09-28, the California Courts SC-100 page listed the form as effective January 1, 2026.
    cite: SC-100 form page
    sources: [jcc-form-sc-100]
    confidence: high
    verified: false
  - id: sc100a
    statement: Form SC-100A lists additional plaintiffs or defendants when SC-100 does not have room for all of them.
    cite: Judicial Council form SC-100A
    sources: [jcc-form-sc-100a]
    confidence: high
    verified: false
  - id: local-forms
    statement: Some courts require additional local forms, so the plaintiff should check the specific court's website or clerk.
    cite: California Courts, small claims forms guidance
    sources: [cc-selfhelp-fill-out-forms]
    confidence: high
    verified: false
  - id: fee-waiver
    statement: A person who cannot afford court fees can ask for a fee waiver using form FW-001.
    cite: Cal. Gov. Code § 68631 et seq.; form FW-001
    sources: [jcc-form-fw-001]
    confidence: high
    verified: false
  - id: fees-vary
    statement: Filing fees depend on the amount claimed and how many small claims the plaintiff has filed in the past 12 months; check the court's current fee schedule rather than relying on a number in this kit.
    cite: California Courts small claims guidance
    sources: [cc-selfhelp-small-claims]
    confidence: medium
    verified: false
  - id: guide-and-file
    statement: California Courts offers free form-filling help, including Guide & File, and free small claims advisors.
    cite: California Courts self-help
    sources: [cc-selfhelp-small-claims]
    confidence: high
    verified: false

  # ---------- Service ----------
  - id: service-who
    statement: The plaintiff may not serve the papers personally; service must be done by someone 18 or older who is not part of the case (for example a friend or family member, or a professional process server), by the county sheriff in counties that offer it, or by certified mail sent by the court clerk in courts that offer it.
    cite: Cal. Code Civ. Proc. § 116.340; California Courts, Serve your small claims forms
    sources: [cc-selfhelp-serve, ccp-116-340]
    confidence: high
    verified: false
    source_check: >-
      2026-10-14 (Shirl): official page lists "The county sheriff (in some counties)", "A professional
      process server you pay", and "Court clerk sends forms by certified mail (only offered in
      some courts)". Earlier wording listed the sheriff/marshal and clerk mail without that
      condition and said "registered" process server, which the page does not say. Statute
      text not read (leginfo blocked).
  - id: service-methods
    statement: Common service methods are personal service, substituted service (leaving papers with a competent adult at the home or business and then mailing a copy), and, in courts that offer it, certified mail by the clerk.
    cite: Cal. Code Civ. Proc. §§ 116.340, 415.20; California Courts, Serve your small claims forms
    sources: [cc-selfhelp-serve, ccp-116-340, ccp-415-20]
    confidence: high
    verified: false
  - id: service-deadline
    statement: Service must be completed at least 15 days before the hearing if the defendant lives in the county where the case was filed, or at least 20 days before if the defendant lives outside that county.
    cite: Cal. Code Civ. Proc. § 116.340(b)
    sources: [ccp-116-340]
    confidence: high
    verified: false
    source_check: >-
      2026-10-16 (Yul, statute check 2A — theo-workspace reports/legalfriend/2026-10-16-ca-statute-check-2A.md fab3e7d46; official text from the Legislature's bulk data pubinfo_2025, records updated 2026-09-26): matches § 116.340(b) ("resides within the county"); "is in" changed to "lives in".
  - id: substituted-service-timing
    statement: Substituted service is not complete until 10 days after the mailing, which must be counted toward the service deadline.
    cite: Cal. Code Civ. Proc. §§ 116.340(a)(3), 415.20(a)–(b)
    sources: [ccp-415-20, ccp-116-340]
    confidence: medium
    verified: false
    source_check: >-
      2026-10-16 (Yul, statute check 2A — theo-workspace reports/legalfriend/2026-10-16-ca-statute-check-2A.md fab3e7d46; official text from the Legislature's bulk data pubinfo_2025, records updated 2026-09-26): matches § 415.20(a)–(b) ("deemed complete on the 10th day after the mailing");
      § 116.340(a)(3) allows substituted service in small claims "without the need to attempt
      personal service". AB 747 (2025) rewrites § 415.20 from 2027-01-01 — recheck in December.
  - id: proof-of-service
    statement: After service, the server completes and signs a proof of service (form SC-104); California Courts says to file the original and a copy at least 5 days before the court date.
    cite: Cal. Code Civ. Proc. § 116.340; SC-104; California Courts, Serve your small claims forms
    sources: [cc-selfhelp-serve, ccp-116-340, jcc-form-sc-104]
    confidence: medium
    verified: false
    source_check: >-
      2026-10-14 (Shirl): official page reads "File the original and copy at least 5 days before your
      court hearing". Earlier wording said "by the deadline the court specifies".

  # ---------- Hearing ----------
  - id: defendant-claim
    statement: The defendant may file a claim against the plaintiff (form SC-120) to be heard in the same case.
    cite: Cal. Code Civ. Proc. § 116.360; SC-120
    sources: [ccp-116-360, jcc-form-sc-120]
    confidence: high
    verified: false
  - id: postpone
    statement: A party can ask to postpone the hearing using form SC-150; whether it is granted is up to the court.
    cite: Judicial Council form SC-150
    sources: [jcc-form-sc-150]
    confidence: medium
    verified: false

  # ---------- After judgment ----------
  - id: plaintiff-no-appeal
    statement: A plaintiff cannot appeal a judgment on the plaintiff's own claim; a defendant can appeal (which leads to a new hearing in superior court), and a plaintiff can appeal a judgment on a defendant's claim.
    cite: Cal. Code Civ. Proc. § 116.710
    sources: [ccp-116-710]
    confidence: high
    verified: false
  - id: appeal-deadline
    statement: A notice of appeal (form SC-140) generally must be filed within 30 days after the clerk mails or delivers the notice of entry of judgment.
    cite: Cal. Code Civ. Proc. § 116.750; SC-140
    sources: [ccp-116-750, jcc-form-sc-140]
    confidence: high
    verified: false
  - id: notice-of-entry
    statement: The judge's decision (the judgment) is given on a Notice of Entry of Judgment (form SC-130 or SC-200); the judge may decide at the hearing, or the court clerk mails the decision.
    cite: Judicial Council forms SC-130, SC-200; California Courts, What happens after your trial
    sources: [cc-selfhelp-after-trial, jcc-form-sc-130, jcc-form-sc-200]
    confidence: high
    verified: false
    source_check: >-
      2026-10-14 (Shirl): official page reads "the judge will either make a decision that day while
      you're in court or a court clerk will mail the judge's decision to you" and "will be on the
      Notice of Entry of Judgment (form SC-130) or Notice of Entry of Judgment (form SC-200)".
      Earlier wording named only SC-130 sent by the clerk.
  - id: statement-of-assets
    statement: Unless the judgment is paid or appealed, the losing party generally must complete a Judgment Debtor's Statement of Assets (form SC-133) and send it to the winning party within the time the law sets.
    cite: Cal. Code Civ. Proc. § 116.830; SC-133
    sources: [ccp-116-830, jcc-form-sc-133]
    confidence: medium
    verified: false
  - id: enforcement-wait
    statement: The winning party generally must wait until the time to appeal or to ask the court to vacate the judgment has passed before starting collection.
    cite: Cal. Code Civ. Proc. § 116.810
    sources: [ccp-116-810]
    confidence: medium
    verified: false
  - id: enforcement-tools
    statement: Common collection tools include a writ of execution (EJ-130) used for bank levies and wage garnishment, an abstract of judgment (EJ-001) that creates a lien on the debtor's real property in a county once it is recorded with that county's recorder, and an order for the debtor to appear for examination.
    cite: Cal. Code Civ. Proc. §§ 699.510, 697.310(a), 708.110; forms EJ-130, EJ-001
    sources: [jcc-form-ej-130, jcc-form-ej-001, ccp-699-510, ccp-697-310, ccp-708-110]
    confidence: medium
    verified: false
    source_check: >-
      2026-10-16 (Yul, statute check 2A — theo-workspace reports/legalfriend/2026-10-16-ca-statute-check-2A.md fab3e7d46; official text from the Legislature's bulk data pubinfo_2025, records updated 2026-09-26): § 697.310(a) — the lien is created "by recording an abstract of a money judgment with
      the county recorder"; § 674 only lists what the abstract contains, so it was dropped from
      the cite. Debtor examination = § 708.110(a).
  - id: judgment-ten-years
    statement: A California money judgment generally expires after 10 years unless it is renewed before then. Since January 1, 2023, some judgments can be renewed only once, for 5 years — California Courts describes this as applying when the debtor is a person (not a business or government agency), the principal owed is less than $200,000 for a medical expense or less than $50,000 for a personal debt, and the debt is not from a tort, fraud, unpaid wages, or other money owed to an employee.
    cite: Cal. Code Civ. Proc. §§ 683.020, 683.110(c)–(d), 683.120(c); California Courts, Renew a small claims judgment
    sources: [cc-selfhelp-renew-judgment, ccp-683-020, ccp-683-110, ccp-683-120]
    confidence: medium
    verified: false
    source_check: >-
      2026-10-14 (Shirl): official page reads "As of January 1, 2023, a judgment can only be
      renewed once for 5 years if" the three conditions above are met. Earlier wording ("can be
      renewed") had no exception, and many small claims judgments may fall under it. Confidence
      lowered to medium until the statute text is read (leginfo blocked).
      2026-10-16 (Yul, statute check 2A — theo-workspace reports/legalfriend/2026-10-16-ca-statute-check-2A.md fab3e7d46; official text from the Legislature's bulk data pubinfo_2025, records updated 2026-09-26): statement matches § 683.110(c)–(d) (renew only once; medical principal < $200,000,
      personal debt < $50,000; natural-person debtor; tort, fraud, employee wages excluded) and
      § 683.120(c) (five years). Cite narrowed.
  - id: satisfaction
    statement: When the judgment is paid in full, the judgment creditor must file an Acknowledgment of Satisfaction of Judgment — usually form SC-290, or form EJ-100 (signed in front of a notary) if a lien was recorded on the debtor's real estate. California Courts says a creditor who does not file within 14 days of being paid can be fined.
    cite: Cal. Code Civ. Proc. § 116.850; SC-290; EJ-100; California Courts, What to do when you get paid
    sources: [cc-selfhelp-when-you-get-paid, ccp-116-850, jcc-form-sc-290, jcc-form-ej-100]
    confidence: medium
    verified: false
    source_check: >-
      2026-10-14 (Shirl): official page reads "If you don't file an Acknowledgment within 14 days of
      being paid, you can be fined" and "If you put any liens on their property (real estate),
      you must use Form EJ-100 instead ... It must be signed in front of a notary." Earlier
      wording named only SC-290 with no deadline.

  # ---------- Common dispute: security deposit ----------
  - id: deposit-21-days
    statement: A residential landlord must return the security deposit, or an itemized statement of deductions with any remaining balance, within 21 days after the tenant moves out.
    cite: Cal. Civ. Code § 1950.5(h)(1)
    sources: [civ-1950-5]
    confidence: high
    verified: false
    source_check: >-
      2026-10-16 (Yul, statute check 2A — theo-workspace reports/legalfriend/2026-10-16-ca-statute-check-2A.md fab3e7d46; official text from the Legislature's bulk data pubinfo_2025, records updated 2026-09-26): the 21-day rule is now subdivision (h)(1) (AB 414, eff. 2026-01-01); (g) is now the
      photo requirement. Cite corrected from (g).
  - id: deposit-bad-faith
    statement: If a landlord keeps a deposit in bad faith, a court may award statutory damages of up to twice the amount of the deposit in addition to actual damages.
    cite: Cal. Civ. Code § 1950.5(m)
    sources: [civ-1950-5]
    confidence: high
    verified: false
    source_check: >-
      2026-10-16 (Yul, statute check 2A — theo-workspace reports/legalfriend/2026-10-16-ca-statute-check-2A.md fab3e7d46; official text from the Legislature's bulk data pubinfo_2025, records updated 2026-09-26): bad-faith damages are now subdivision (m). Cite corrected from (l).

# Things the kit must NOT state as fact (always send the reader to the source):
do_not_state:
  - Exact filing fee amounts
  - Effective dates of any form other than as recorded in sources/manifest.yaml
  - Local court rules or local forms for any specific county
  - How a particular judge will decide, or likelihood of winning
