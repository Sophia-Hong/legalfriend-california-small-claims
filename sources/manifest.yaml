# Source manifest — every source the kit relies on.
#
# Rules (PRD §10):
# - Retrieval priority is set by `priority` (1 = highest), per PRD §10.1.
# - A form is keyed by form_number + effective_date + source_url + version_hash,
#   never by form number alone.
# - New effective versions are ADDED; the old record gets `superseded_by` and stays.
# - `last_verified` is only set by scripts/fetch_sources after a successful fetch.
#   Seeded entries below are `status: pending_fetch` and have not been fetched.
# - Facts noted in `notes_from_prd` were observed by the PRD author on 2026-09-28
#   and must be re-confirmed against the fetched source before use.

schema_version: 1
jurisdiction: CA
proceeding: small_claims

priority_order:
  1: California Courts / Judicial Branch official self-help
  2: Judicial Council forms and official instructions
  3: California statutes
  4: California Rules of Court
  5: Superior Court local resources
  6: LegalFriend practice notes
  7: Secondary explanatory sources (only when necessary, clearly labeled)

